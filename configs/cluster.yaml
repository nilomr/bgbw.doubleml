paths:
  # Update these to match the actual paths on the cluster
  harmonized_dir: /data/bgbw/harmonized
  bng_surveys_dir: /data/bgbw/bng_surveys
  aef_dir: /data/bgbw/aef
  weather_path: /data/bgbw/weather/bgbw_weather.parquet
  january_weather_path: /data/bgbw/weather/bgbw_january_weather.parquet

run:
  species: all  # expands to all 73 species in SPECIES_COLUMNS
  years: [2017, 2019, 2021, 2023]
  output_dir: output/cluster

model:
  n_pca_components: 15
  n_estimators: 1000
  cf_n_estimators: 1000
  rf_min_samples_leaf: 10
  cf_min_samples_leaf: 50

compute:
  n_workers: 20      # parallel ensemble/RC workers
  inner_n_jobs: 5    # threads per RF/CausalForest fit (n_workers * inner_n_jobs <= total CPUs)

ensemble:
  run: true
  n_ensemble: 100
  n_rc_sims: 100

log_file: logs/cluster.log
