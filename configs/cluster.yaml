paths:
  # Update these to match the actual paths on the cluster
  harmonized_dir: /data/BS/userdata/nilo/projects/BGBW/data/harmonized
  aef_dir: /data/BS/userdata/nilo/projects/BGBW/metadata/spatial/aef/
  weather_path: /data/BS/userdata/nilo/projects/BGBW/metadata/weather/bgbw_weather.parquet
  january_weather_path: /data/BS/userdata/nilo/projects/BGBW/metadata/weather/bgbw_january_weather.parquet
  uk_shp: /data/BS/userdata/nilo/projects/BGBW/metadata/uk-shapefile/UK-shapefile.shp
  output_dir: output/cluster   # absolute or relative to cwd; env var BGBW_OUTPUT_DIR overrides

run:
  species: [wood_pigeon, house_sparrow,blackcap, red_kite, ring_necked_parakeet, collared_dove, starling, chaffinch, greenfinch, goldfinch, blue_tit, great_tit]
  years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]

model:
  n_pca_components: 30
  n_estimators: 800
  cf_n_estimators: 800
  rf_min_samples_leaf: 10
  cf_min_samples_leaf: 10

compute:
  # n_workers: parallel workers for ensemble and RC loops.
  # Set to min(n_ensemble, n_rc_sims) — values higher than the task count are
  # automatically clamped, and inner threading is auto-set to cpu_count // n_workers.
  # Rule of thumb: n_workers = n_ensemble = n_rc_sims saturates the node cleanly.
  # inner_n_jobs: 0  # 0 = auto; set >0 to override threads per fit
  # sim_n_estimators: trees per RF/CausalForest fit inside ensemble members and RC sims.
  #   0 = same as n_estimators (default). 150-250 is statistically sound because
  #   averaging across N members compensates for reduced per-member precision.
  n_workers: 30
  sim_n_estimators: 300

ensemble:
  run: true
  n_ensemble: 30
  n_rc_sims: 10

log_file: logs/cluster.log
